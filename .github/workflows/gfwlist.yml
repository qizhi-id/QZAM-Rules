name: QZAM GFWList verified update
on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * *'
permissions:
  contents: write
concurrency:
  group: verified-gfwlist
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tooling
        run: python -m pip install -r requirements.txt
      - name: Test converter and fail-closed review gate
        run: python -m unittest discover -s tests -v
      - name: Verify / generate from official GFWList
        run: |
          python scripts/gfwlist_convert.py --fetch \
            --approved-file policy/approved_unsupported.json \
            --output-dir . --min-proxy 1000
      - name: Check generated provider schema
        run: |
          python - <<'PY'
          import yaml
          for name in ('direct', 'proxy'):
              doc = yaml.safe_load(open(f'rules/gfwlist-{name}.yaml', encoding='utf-8'))
              assert set(doc) == {'payload'} and isinstance(doc['payload'], list)
              assert all(x.startswith('DOMAIN-SUFFIX,') for x in doc['payload'])
          PY
      - name: Publish only verified content
        run: |
          git config user.name 'qzam-rule-bot'
          git config user.email 'qzam-rule-bot@users.noreply.github.com'
          git add rules/gfwlist-direct.yaml rules/gfwlist-proxy.yaml report/conversion.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(rules): update verified GFWList providers' \
              -m 'Co-Authored-By: Claude Code <noreply@anthropic.com>'
            git push origin HEAD:main
          fi
